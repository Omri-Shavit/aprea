name: Deploy frontend to GitHub Pages

# Builds the Vite app and publishes to gh-pages/searchable-wee1-inhibitor-database/
# Live URL: https://omri-shavit.github.io/aprea/searchable-wee1-inhibitor-database/
#
# Requires a self-hosted runner (see scripts/create-gcp-runner-vm.ps1).
# Repo Variables (Settings → Actions → Variables):
#   VITE_API_BASE_URL      Cloud Run URL (optional until backend is deployed)
#
# Auth is OFF in production builds (VITE_REQUIRE_AUTH=false below).
# When Microsoft Entra ID is ready, set VITE_REQUIRE_AUTH=true and add client ids.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE: /aprea/searchable-wee1-inhibitor-database/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_REQUIRE_AUTH: "false"
          VITE_ALLOWED_DOMAIN: aprea.com

      - name: Publish to gh-pages (subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          destination_dir: searchable-wee1-inhibitor-database
          keep_files: true
