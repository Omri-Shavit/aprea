name: Deploy frontend to GitHub Pages

# Builds the Vite app and publishes to the gh-pages branch (repo root).
# Live URL: https://omri-shavit.github.io/aprea/
#
# Requires a self-hosted runner (see scripts/create-gcp-runner-vm.ps1).
# Repo Variables (Settings → Actions → Variables):
#   VITE_API_BASE_URL      Cloud Run URL (optional until backend is deployed)
#   VITE_GOOGLE_CLIENT_ID  OAuth Web client id

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Match default labels GitHub assigns to a Linux self-hosted runner.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE: /aprea/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_ALLOWED_DOMAIN: aprea.com

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          keep_files: false
