name: Deploy frontend to GitHub Pages

# Builds the Vite app and publishes it into the
# `searchable-wee1-inhibitor-database/` subfolder of the gh-pages branch, so the
# app is served at:
#   https://omri-shavit.github.io/aprea/searchable-wee1-inhibitor-database/
#
# Assumes this repo is named `aprea` and its root contains `frontend/`.
# Configure these repo-level Variables (Settings -> Secrets and variables ->
# Actions -> Variables), NOT secrets (they're baked into the public bundle):
#   VITE_API_BASE_URL     e.g. https://wee1-evidence-api-xxxxx-uc.a.run.app
#   VITE_GOOGLE_CLIENT_ID  the OAuth 2.0 Web client id

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Self-hosted runner on GCP VM (see scripts/create-gcp-runner-vm.ps1).
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /aprea/searchable-wee1-inhibitor-database/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_ALLOWED_DOMAIN: aprea.com

      - name: Publish to gh-pages (subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          destination_dir: searchable-wee1-inhibitor-database
          keep_files: true
